# -*- python -*-
# The flow: a series is applied from lore, each of its patches is checked in a build of
# its own, then the whole series is built. The work itself is done by the tasks of the
# worker image (tasks/); this only says what runs, in which order, and what blocks what.
# The project it checks is project.ini, next to this file (see samples/).

import configparser
import os
import re

from buildbot.plugins import schedulers, steps, util, worker
from buildbot.process import buildstep, logobserver
from buildbot.process.results import CANCELLED, EXCEPTION, FAILURE, SUCCESS, WARNINGS
from twisted.internet import defer

import reporterjson

ini = configparser.ConfigParser()
with open(os.path.join(basedir, 'project.ini')) as f:
    ini.read_file(f)
project = ini['project']
WORKERS = project['workers'].split()

# The tasks' exit codes.
TASK_RC = {0: SUCCESS, 1: FAILURE, 3: WARNINGS}

c = BuildmasterConfig = {}
c['title'] = 'sashing-ci'
c['buildbotURL'] = project['url']
c['www'] = {'port': 8010, 'plugins': {'waterfall_view': {}}}
c['protocols'] = {'pb': {'port': 9989}}
c['buildbotNetUsageData'] = None

# A worker runs one build of each builder at a time: a series waiting on its patches
# never takes the slot they need. More builds at once take more workers.
c['workers'] = [worker.Worker(name, os.environ['WORKERPASS']) for name in WORKERS]

# The patch builds of a series all have the same sourcestamp, the base: merging their
# requests would check only one of them.
c['collapseRequests'] = False

c['projects'] = [util.Project(name=project['name'], description=project['description'])]


class ForEachCommit(steps.Trigger):
    """Trigger the schedulers once per commit of the `commits` property, which the
    triggered builds get as their `commit` property."""

    def getSchedulersAndProperties(self):
        return [
            {'sched_name': name, 'props_to_set': {**self.set_properties, 'commit': commit},
             'unimportant': False}
            for commit in self.getProperty('commits').split()
            for name in self.schedulerNames
        ]


class ForEachBinding(buildstep.ShellMixin, steps.BuildStep):
    """Run a command listing binding schemas, and add a dt-binding-check step for each of
    them after this one."""

    def __init__(self, **kwargs):
        kwargs = self.setupShellMixin(kwargs)
        super().__init__(**kwargs)
        self.observer = logobserver.BufferLogObserver()
        self.addLogObserver('stdio', self.observer)

    @defer.inlineCallbacks
    def run(self):
        cmd = yield self.makeRemoteShellCommand()
        yield self.runCommand(cmd)
        if cmd.results() == SUCCESS:
            # Their findings only warn, like checkpatch's. Buildbot takes step names of up
            # to 50 characters, which some schemas' names exceed here: SQLite stores them
            # anyway, other databases would refuse them.
            self.build.addStepsAfterCurrentStep([
                steps.ShellCommand(
                    name=f'dt-binding-check-{os.path.basename(path).removesuffix(".yaml")}',
                    command=['dt-binding-check', path], decodeRC=TASK_RC,
                    flunkOnFailure=False, warnOnFailure=True)
                for path in self.observer.getStdout().split()
            ])
        return cmd.results()


class SummaryLine(steps.ShellCommand):
    """A ShellCommand whose summary is the line of its output matching `pattern`."""

    def __init__(self, pattern, **kwargs):
        super().__init__(**kwargs)
        self.pattern = re.compile(pattern)
        self.addLogObserver('stdio', logobserver.LineConsumerLogObserver(self.summary))

    def summary(self):
        while True:
            _, line = yield
            if self.pattern.match(line):
                self.descriptionDone = [line]


def checkout_base():
    # The builder's clone is source/, which no task touches. A build works in a worktree of
    # it, build/, made anew: nothing a build leaves in its tree reaches the next one.
    return [
        steps.Git(repourl=project['git_url'], branch=project['git_base'], mode='incremental',
                  workdir='source', haltOnFailure=True),
        steps.ShellCommand(
            name='worktree', workdir='source',
            command='rm -rf ../build && git worktree prune && git worktree add --detach ../build HEAD',
            haltOnFailure=True),
    ]


def kbuild(preset, config, *target, **env):
    # Every preset is built, whichever failed before. make --silent can stay quiet longer
    # than the default timeout on a big config.
    return steps.Compile(name=f'kbuild-{preset}-{config}', command=['kbuild', preset, config, *target],
                         descriptionDone=[preset, config, *target],
                         env=env, haltOnFailure=False, warnOnWarnings=True, timeout=None)


# Out of the master's volume: a master restart, which ends the builds, takes the bundles
# a build could not delete.
bundle = util.Interpolate('/tmp/bundles/%(prop:buildnumber)s.bundle')

series = util.BuildFactory([
    *checkout_base(),
    steps.ShellCommand(
        name='apply-series',
        command=['apply-series', '../commits', util.Property('msgid')],
        decodeRC=TASK_RC, haltOnFailure=True, warnOnWarnings=True),
    steps.SetPropertyFromCommand(name='commits', command=['cat', '../commits'],
                                 property='commits', haltOnFailure=True),
    steps.ShellCommand(
        name='bundle',
        command=['git', 'bundle', 'create', '../series.bundle',
                 util.Interpolate('%(prop:got_revision)s..HEAD')],
        haltOnFailure=True),
    steps.FileUpload(workersrc='../series.bundle', masterdest=bundle, haltOnFailure=True),
    # A patch that fails stops the series here; checkpatch's findings only warn.
    ForEachCommit(name='patches', schedulerNames=['patch'],
                  set_properties={'bundle': bundle, 'series_msgid': util.Property('msgid'),
                                  'owner': util.Property('owner')},
                  waitForFinish=True, haltOnFailure=True, warnOnWarnings=True),
    steps.MasterShellCommand(name='rm-bundle', command=['rm', '-f', bundle], alwaysRun=True),
    # The tree is at the series' last commit.
    *[kbuild(preset, config) for config, presets in ini['series'].items()
      for preset in presets.split()],
])

patch = util.BuildFactory([
    *checkout_base(),
    steps.FileDownload(mastersrc=util.Property('bundle'), workerdest='../series.bundle',
                       haltOnFailure=True),
    steps.ShellCommand(
        name='checkout',
        command=util.Interpolate('git fetch -q ../series.bundle && git checkout -q --detach %(prop:commit)s'),
        haltOnFailure=True),
    # The trailer b4 gave the commit: the patch's own message.
    steps.SetPropertyFromCommand(
        name='msgid',
        command="git log -1 --format='%(trailers:key=Message-ID,valueonly)' | tr -d '<>'",
        property='msgid', haltOnFailure=True),
    SummaryLine(r'total: ', name='checkpatch', command=['checkpatch'], decodeRC=TASK_RC,
                flunkOnFailure=False, warnOnFailure=True, warnOnWarnings=True),
    # The binding schemas the commit adds or changes, each checked in a step of its own.
    ForEachBinding(name='bindings',
                   command=['git', 'diff', '--name-only', '--diff-filter=AM', 'HEAD~1', '--',
                            'Documentation/devicetree/bindings/*.yaml'],
                   haltOnFailure=True),
    *[kbuild(preset, project['patch_config'], project['patch_target'], KCFLAGS='-Werror')
      for preset in project['presets'].split()],
])

c['builders'] = [
    util.BuilderConfig(name='series', workernames=WORKERS, factory=series,
                       project=project['name']),
    util.BuilderConfig(name='patch', workernames=WORKERS, factory=patch,
                       project=project['name']),
]

c['schedulers'] = [
    schedulers.ForceScheduler(
        name='series', builderNames=['series'],
        # The tree comes from the project, not from the form.
        codebases=[util.CodebaseParameter('', hide=True)],
        properties=[
            util.StringParameter(name='msgid', label='Message-ID', required=True, size=80),
        ]),
    schedulers.Triggerable(name='patch', builderNames=['patch']),
]


# Patchwork: each test of a run pw-triage-bot started goes back to patchwork as it ends,
# through the host's pw-check.
if ini.has_section('patchwork'):
    pw = ini['patchwork']
    # The steps that are tests; the others are the flow's own.
    TESTS = re.compile(r'checkpatch|kbuild-.*|dt-binding-check-.*')
    # A test cancelled, or broken by the CI, only warns; its summary says which.
    PW_STATES = {SUCCESS: 'success', WARNINGS: 'warning', FAILURE: 'fail',
                 EXCEPTION: 'warning', CANCELLED: 'warning'}

    def pw_request(build, step):
        """pw-check's request for a step: a patch build's test on its patch, a series
        build's on every patch of its series."""
        properties = build['properties']
        state = PW_STATES.get(step['results'])
        if (properties.get('owner', [None])[0] != pw['owner'] or state is None
                or not TESTS.fullmatch(step['name'])):
            return None
        return {
            'msgid': properties['msgid'][0],
            'series': build['builder']['name'] == 'series',
            'checks': [{
                # patchwork takes a slug.
                'context': re.sub(r'[^-a-zA-Z0-9_]', '-', step['name']),
                'state': state,
                'description': step['state_string'],
                'url': (f"{project['url']}#/builders/{build['builderid']}"
                        f"/builds/{build['number']}/steps/{step['number']}/logs/stdio"),
            }],
        }

    c['services'] = [reporterjson.SocketJsonReporter(
        pw['socket'], generators=[reporterjson.StepGenerator(pw_request)])]
