# tuxmake sets the cache directory: ~/.ccache.
# The objects of every preset's allyesconfig and defconfig, and of the patch builds,
# take about 10G.
max_size = 50G
# Paths under the base, the worker's home, are hashed relative to the build directory:
# builds of different builders, and of different workers sharing the cache, hit each
# other's objects as long as the build directory sits at the same place relative to the
# tree (see tasks/kbuild).
base_dir = /home/sashing
hash_dir = false
