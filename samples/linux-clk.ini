# A project a sashing-ci instance checks: the master reads its own from
# ~/.config/sashing-ci/project.ini.

[project]
name = linux-clk
description = Pre-flight checks for linux-clk@vger.kernel.org
# Where the web UI is reached: patchwork's checks link to its log pages there.
url = http://localhost:8011/
# The tree a series applies on.
git_url = git://git.kernel.org/pub/scm/linux/kernel/git/clk/linux.git
git_base = clk-next
# tuxmake presets, from tasks/tuxmake/: each patch build is made with all of them.
presets = x86_64-gcc arm64-clang armhf-clang riscv-clang
# What a patch build builds, with -Werror: a config, and only a part of the tree.
patch_config = allyesconfig
patch_target = drivers/clk/
# The workers, by name.
workers = local1 local2

# What a series build builds whole: each config, with the presets listed for it.
[series]
allyesconfig = x86_64-gcc arm64-clang
defconfig = x86_64-gcc arm64-clang armhf-clang riscv-clang

# Patchwork, where pw-triage-bot triages: the tests of the runs it starts go back there
# through its pw-check socket, in the pw-check volume the master mounts.
[patchwork]
# The runs reported to patchwork: those started by this user, the one the hook,
# trigger-ci.sh, gives.
owner = pw-triage-bot <pw-triage-bot@localhost.lan>
# pw-check's socket, in the master.
socket = /run/pw-check/linux-clk.sock
